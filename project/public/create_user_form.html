<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New User</title>
    <link rel="stylesheet" href="./css/generalStyle.css">
    <link rel="stylesheet" href="./css/formStyle.css">
    <script src="./js/script.js" defer></script>
    <script src="./js/passwordStrength.js" defer></script>
</head>
<body>
    <h1 class="title">Create New User</h1>
    <div class="card">
        <form method="POST" action="./sql/createUserMySql.php" onsubmit="return validateFormBeforeSubmit(event)">
            <input placeholder="Username" type="text" name="username" required id="usernameInput"> <br>
            <input placeholder="Email" type="email" name="email"> <br>
            <div class="password-wrapper">
                <input placeholder="Password" type="password" name="password" required id="passwordInput">
                <img id="eye" onclick="togglePasswordVisibility()" src="./media/images/privacyHiding.png" alt="Show Password">
            </div>
            <div id="strengthIndicator" class="strength-indicator"></div>
            <div id="strengthMessage" class="strength-message"></div>
            <input type="submit" name="submit" value="Create New User" id="submitButton">
        </form>
    </div>

    <script>
        // Initialize password strength checker
        document.addEventListener("DOMContentLoaded", function() {
            PasswordStrength.initializeChecker("passwordInput", "strengthIndicator");
        });

        // Validate form before submission
        function validateFormBeforeSubmit(event) {
            const password = document.getElementById("passwordInput").value;
            const username = document.getElementById("usernameInput").value;
            const messageDiv = document.getElementById("strengthMessage");

            const validation = PasswordStrength.validatePassword(password, username);

            if (!validation.valid) {
                event.preventDefault();
                messageDiv.textContent = "❌ " + validation.message;
                messageDiv.style.color = "#dc3545";
                messageDiv.style.marginTop = "10px";
                messageDiv.style.fontWeight = "bold";
                return false;
            }

            messageDiv.textContent = "✓ Password accepted!";
            messageDiv.style.color = "#28a745";
            messageDiv.style.marginTop = "10px";
            messageDiv.style.fontWeight = "bold";
            return true;
        }
    </script>
</body>
</html>
