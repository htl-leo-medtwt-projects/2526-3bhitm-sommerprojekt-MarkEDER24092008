    <div class="languageSelectContainer">

            <p class="languageSelectDescription">
                Select the language you'd like to learn with IndiGO!
            </p>

            <div class="languageOptions">
                <!-- English -->
                <form method="POST" action="./sql/selectLanguage.php" class="languageForm">
                    <input type="hidden" name="language_id" value="1">
                    <input type="hidden" name="language_name" value="english">
                    <button type="submit" class="languageButton">
                        <img src="./media/images/languages/english_select_button.png" alt="English">
                        <span>English</span>
                    </button>
                </form>

                <!-- German -->
                <form method="POST" action="./sql/selectLanguage.php" class="languageForm">

                        <span>German</span>
                    </button>
                </form>

                <!-- Italian -->
                <form method="POST" action="./sql/selectLanguage.php" class="languageForm">
                    <input type="hidden" name="language_id" value="3">
