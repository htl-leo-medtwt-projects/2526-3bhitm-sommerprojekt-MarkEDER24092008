<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="./css/generalStyle.css">
    <link rel="stylesheet" href="./css/formStyle.css">
    <script src="./js/passwordStrength.js" defer></script>
    <script src="./js/audio.js" defer></script>
</head>
<body>

    <h1 class="title">Set New Password</h1>
    <div class="card" id="resetContainer">
        <!-- Form will be inserted here by JavaScript -->
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('resetContainer');

        if (!token) {
            container.innerHTML = `
                <div style='text-align: center; padding: 40px 20px;'>
                    <h2 style='color: #dc3545;'>❌ Invalid Reset Link</h2>
                    <p>The reset link is missing or invalid.</p>
                    <a href='./login_form.html' style='display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #a581e8; color: white; text-decoration: none; border-radius: 5px;'>Back to Login</a>
                </div>
            `;
        } else {
            // Verify token with backend
            fetch('../sql/verifyResetToken.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token })
            })
            .then(response => response.json())
            .then(data => {
                if (data.valid) {
                    container.innerHTML = `
                        <form method="POST" action="./sql/resetPasswordMySql.php" onsubmit="return validateResetForm(event)">
                            <input type="hidden" name="token" value="${encodeHTMLAttr(token)}">
                            <div class="password-wrapper">
                                <input placeholder="New Password" type="password" name="password" required id="passwordInput">
                                <img id="eye" onclick="togglePasswordVisibility()" src="./media/images/privacyHiding.png" alt="Show Password">
                            </div>
                            <div id="strengthIndicator" class="strength-indicator"></div>
                            <div id="strengthMessage" class="strength-message"></div>
                            <input type="submit" name="submit" value="Reset Password">
                            <a href="../login_form.html" style="text-align: center; display: block; margin-top: 15px; color: #a581e8; text-decoration: none; font-size: 14px;">Back to Login</a>
                        </form>
                    `;
                    
                    // Initialize password strength checker
                    setTimeout(() => {
                        PasswordStrength.initializeChecker("passwordInput", "strengthIndicator");
                    }, 100);
                } else {
                    container.innerHTML = `
                        <div style='text-align: center; padding: 40px 20px;'>
                            <h2 style='color: #dc3545;'>❌ ${data.message}</h2>
                            <p>The reset link has expired or is invalid.</p>
                            <a href='./forgot_password.html' style='display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #a581e8; color: white; text-decoration: none; border-radius: 5px;'>Request New Link</a>
                        </div>
                    `;
                }
            })
            .catch(error => {
                container.innerHTML = `
                    <div style='text-align: center; padding: 40px 20px;'>
                        <h2 style='color: #dc3545;'>❌ Error</h2>
                        <p>There was an error verifying your reset link.</p>
                        <a href='./forgot_password.html' style='display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #a581e8; color: white; text-decoration: none; border-radius: 5px;'>Try Again</a>
                    </div>
                `;
            });
        }

        function encodeHTMLAttr(str) {
            return str.replace(/[&<>"']/g, function(c) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[c];
            });
        }

        function validateResetForm(event) {
            const password = document.getElementById("passwordInput").value;
            const messageDiv = document.getElementById("strengthMessage");

            const validation = PasswordStrength.validatePassword(password, "");

            if (!validation.valid) {
                event.preventDefault();
                messageDiv.textContent = "❌ " + validation.message;
                messageDiv.style.color = "#dc3545";
                messageDiv.style.marginTop = "10px";
                messageDiv.style.fontWeight = "bold";
                return false;
            }

            messageDiv.textContent = "✓ Password accepted!";
            messageDiv.style.color = "#28a745";
            messageDiv.style.marginTop = "10px";
            messageDiv.style.fontWeight = "bold";
            return true;
        }
    </script>
</body>
</html>
