<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiGO–Home</title>
  <link rel="stylesheet" href="./css/generalStyle.css">
  <link rel="stylesheet" href="./css/homeStyle.css">
  <link rel="icon" type="image/png" href="./media/images/favicons/home_favicon.png">
</head>
<body>


    <!-- Main Card -->
    <div class="mainCard">
      

      <!-- Timeline -->
      <div class="languagePath">


        <div class="step">
          <button class="lessonButton" onclick="handleLessonClick(event)"><img src="./media/images/studyHat.png" alt="Learning exercise"></button>
        </div>

        <div class="step">
          <button class="lessonButton" onclick="handleLessonClick(event)"><img src="./media/images/pencil.png" alt="Writing exercise"></button>
        </div>

        <div class="step">
          <button class="lessonButton" onclick="handleLessonClick(event)"><img src="./media/images/speech.png" alt="Speaking exercise"></button>
        </div>

      </div>

      <!-- Character -->
      <div class="character">
        <img src="./media/mascot/mascot_protoype_lookingUp.png" alt="">
      </div>
      
    
    </div>
    <!-- Bottom Navigation -->
    <nav class="bottomNav">
      <a href="./home.html">
        <div class="bottomNavButton"><img src="./media/images/home.png" alt="Home"></div>
      </a>

      <a href="./settings.html">
        <div class="bottomNavButton"><img src="./media/images/settings.png" alt="Settings"></div>
      </a>

      
      <a href="./profile.html">
        <div class="bottomNavButton"><img src="./media/images/profile.png" alt="Profile"></div>
      </a>

      <a href="./streak.html">
        <div class="bottomNavButton"><img src="./media/images/fire.gif" alt="Streak"></div>
      </a>
    </nav>

    <script>
      /**
       * Handle lesson button clicks
       * Marks today's lesson as completed and updates the streak
       */
      async function handleLessonClick(event) {
        event.preventDefault();
        
        try {
          // Call the lesson completion endpoint
          const response = await fetch('./sql/completeLesson.php', {
            method: 'POST'
          });
          const data = await response.json();
          
          if (data.success) {
            console.log('Lesson marked as completed:', data.message);
          } else {
            console.error('Error marking lesson as completed:', data.error);
          }
        } catch (error) {
          console.error('Error:', error);
        }
        
        // Navigate to lesson page
        window.location.href = './lesson.html';
      }
    </script>

</body>
</html>
