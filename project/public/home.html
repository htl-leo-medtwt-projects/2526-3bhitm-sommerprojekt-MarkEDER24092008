<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiGO–Home</title>
  <link rel="stylesheet" href="./css/generalStyle.css">
  <link rel="stylesheet" href="./css/homeStyle.css">
  <link rel="icon" type="image/png" href="./media/images/favicons/home_favicon.png">
  <script src="./js/theme.js"></script>
</head>
<body>


    <!-- Hearts meter (top-right) -->
    <div id="home-hearts-meter" class="hearts-meter" aria-label="Hearts meter">
      <div class="hearts-icon">
        <img id="heart-image" src="./media/images/heart.png" alt="Heart" />
      </div>
      <div class="hearts-count" id="hearts-count">5</div>
    </div>

    <!-- Main Card -->
    <div class="mainCard">
      

      <!-- Timeline -->
      <div class="languagePath">


        <div class="step">
          <a href="./exercise.html?mode=multiple_choice" class="lessonLink" aria-label="Learning exercise">
            <button class="lessonButton" type="button"><img src="./media/images/studyHat.png" alt="Learning exercise"></button>
          </a>
        </div>

        <div class="step">
          <a href="./exercise.html?mode=text" class="lessonLink" aria-label="Writing exercise">
            <button class="lessonButton" type="button"><img src="./media/images/pencil.png" alt="Writing exercise"></button>
          </a>
        </div>

        <div class="step">
          <button class="lessonButton" type="button" disabled style="opacity:0.6; cursor:not-allowed;" aria-label="Speaking exercise (coming soon)">
            <img src="./media/images/speech.png" alt="Speaking exercise">
          </button>
          <div class="comingSoonText" style="text-align:center; margin-top:4px; font-size:12px; opacity:0.8;">Coming soon</div>
        </div>

      </div>

      <!-- Character -->
      <div class="character">
                    <video autoplay loop muted playsinline>
                <source src="./media/mascot/mascot_idle.webm" type="video/webm">
                Your browser does not support the video tag.
                </video>
            </div>
      
    
    </div>
    <!-- Bottom Navigation -->
    <nav class="bottomNav">
      <a href="./home.html">
        <div class="bottomNavButton"><img src="./media/images/home.png" alt="Home"></div>
      </a>

      <a href="./settings.html">
        <div class="bottomNavButton"><img src="./media/images/settings.png" alt="Settings"></div>
      </a>

      <a href="./progress.html">
        <div class="bottomNavButton"><img src="./media/images/progress.png" alt="Progress"></div>
      </a>

      <a href="./profile.php">
        <div class="bottomNavButton"><img src="./media/images/profile.png" alt="Profile"></div>
      </a>

      <a href="./streak.html">
        <div class="bottomNavButton"><img src="./media/images/fire.gif" alt="Streak"></div>
      </a>
    </nav>

  <script src="./js/audio.js" defer></script>

  <script>
    // Load hearts left (same source as the exercise page)

    async function loadHomeHearts() {
      try {
        const res = await fetch('./sql/exercise_get.php?mode=multiple_choice', { method: 'GET' });
        const data = await res.json();

        if (data && data.success && typeof data.hearts === 'number') {
          const heartsEl = document.getElementById('hearts-count');
          if (heartsEl) heartsEl.textContent = data.hearts;
        }
      } catch (e) {
        console.error('Failed to load hearts:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadHomeHearts);
  </script>
</body>
</html>
